<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fraction Practice Quiz</title>

    <link rel="stylesheet" href="FractionClassWebsiteStyle.css">
</head>

<body>

    <main class="quiz-container">

        <h1>Fraction Practice Quiz</h1>

        <p class="instructions">
            Answers must be in lowest simplified terms.
        </p>


        <!-- Start Screen -->
        <section id="start-screen">

            <label for="question-count">
                How many questions would you like to solve?
            </label>

            <input
                type="number"
                id="question-count"
                min="1"
                max="50"
                value="5"
            >

            <button id="start-button">
                Start Quiz
            </button>

        </section>


        <!-- Quiz Screen -->
        <section id="quiz-screen" class="hidden">

            <p id="question-number"></p>

            <div id="problem" class="problem"></div>

            <input
                type="text"
                id="answer"
                placeholder="Example: -3/4 or 2"
            >

            <button id="submit-button">
                Submit Answer
            </button>

            <p id="feedback"></p>

        </section>


        <!-- Results Screen -->
        <section id="results-screen" class="hidden">

            <h2>Quiz Results</h2>

            <p id="final-score"></p>

            <p id="percentage"></p>

            <p id="result-message"></p>

            <button id="restart-button">
                Try Again
            </button>

        </section>

    </main>


    <script src="FractionClass.js"></script>

</body>
</html>
