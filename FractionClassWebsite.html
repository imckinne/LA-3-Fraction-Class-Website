<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fraction Practice Quiz</title>

    <link rel="stylesheet" href="FractionClassWebsiteStyle.css">
</head>

<body>

    <main class="quiz-container">

        <h1>Fraction Practice Quiz</h1>

        <p class="instructions">
            Answers must be in lowest simplified terms.
        </p>


        <!-- Settings / Start Screen -->
        <section id="start-screen">

            <div class="setting-group">
                <label for="question-count">Number of Questions:</label>
                <input
                    type="number"
                    id="question-count"
                    min="1"
                    max="50"
                    value="5"
                >
            </div>

            <div class="setting-group">
                <label>Operations to Include:</label>
                <div class="checkbox-group">
                    <div class="op-item">
                        <label><input type="checkbox" id="op-add" value="+" checked> Addition (+)</label>
                        <button class="help-btn" data-op="+" type="button" aria-label="Help with Addition">?</button>
                    </div>

                    <div class="op-item">
                        <label><input type="checkbox" id="op-sub" value="-" checked> Subtraction (-)</label>
                        <button class="help-btn" data-op="-" type="button" aria-label="Help with Subtraction">?</button>
                    </div>

                    <div class="op-item">
                        <label><input type="checkbox" id="op-mul" value="*" checked> Multiplication (×)</label>
                        <button class="help-btn" data-op="*" type="button" aria-label="Help with Multiplication">?</button>
                    </div>

                    <div class="op-item">
                        <label><input type="checkbox" id="op-div" value="/" checked> Division (÷)</label>
                        <button class="help-btn" data-op="/" type="button" aria-label="Help with Division">?</button>
                    </div>
                </div>
            </div>

            <div class="setting-group">
                <label>Value Range (Numerator/Denominator):</label>
                <div class="range-inputs">
                    <input type="number" id="range-min" value="-10" placeholder="Min">
                    <span>to</span>
                    <input type="number" id="range-max" value="10" placeholder="Max">
                </div>
            </div>

            <button id="start-button">
                Start Quiz
            </button>

        </section>


        <!-- Quiz Screen -->
        <section id="quiz-screen" class="hidden">

            <p id="question-number"></p>

            <div id="problem" class="math-question"></div>

            <input
                type="text"
                id="answer"
                placeholder="Example: -3/4 or 2"
            >

            <button id="submit-button">
                Submit Answer
            </button>

            <p id="feedback"></p>

        </section>


        <!-- Results Screen -->
        <section id="results-screen" class="hidden">

            <h2>Quiz Results</h2>

            <p id="final-score"></p>

            <p id="percentage"></p>

            <p id="result-message"></p>

            <button id="restart-button">
                Try Again
            </button>

        </section>

    </main>

    <!-- Help Modal Overlay -->
    <div id="help-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal" aria-label="Close modal">&times;</button>
            <h2 id="modal-title">How to Solve</h2>
            <div id="modal-body"></div>
        </div>
    </div>


    <script src="FractionClass.js"></script>

</body>
</html>
